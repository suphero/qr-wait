<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Görevli Paneli</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <h1 id="name">Görevli paneli</h1>
  <p id="stats" class="muted"></p>
  <p id="err" class="err"></p>

  <div id="qrCard" class="card center">
    <div id="qr"></div>
    <p><b>Sıraya girmek için telefon kameranızla okutun</b></p>
    <button class="secondary" id="fullBtn">Tam ekran QR</button>
  </div>

  <div class="card">
    <h2>Boşalan yer sayısı</h2>
    <div class="row">
      <input id="freeN" type="number" min="1" max="500" value="1" inputmode="numeric">
      <button id="freeBtn">Yer boşaldı, sıradakileri çağır</button>
    </div>
    <p id="avail" class="muted"></p>
  </div>

  <div class="card">
    <h2>Çağrılanlar</h2>
    <div id="called"></div>
  </div>

  <div class="card">
    <h2>Bekleyenler</h2>
    <div id="waiting"></div>
  </div>

  <div class="card">
    <h2>Elle ekle (telefonu olmayanlar için)</h2>
    <div class="row">
      <select id="addSize"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
      <input id="addNote" placeholder="Not (ör. şapkalı amca)" maxlength="60">
    </div>
    <div id="addAcceptBox" hidden>
      <p class="muted">Kaç yer olursa kabul ediyorlar?</p>
      <div id="addAccept" class="picks"></div>
    </div>
    <button id="addBtn">Sıraya ekle</button>
  </div>

  <button class="bad" id="resetBtn">Sırayı sıfırla (gün sonu)</button>
</main>
<script src="app.js"></script>
<script>
// Hash: "<slug veya id>.<anahtar>" ya da alt alan adında yalnızca "<anahtar>"
const hash = location.hash.slice(1), dot = hash.indexOf(".");
const ref = dot < 0 ? "" : hash.slice(0, dot), key = hash.slice(dot + 1);
let room; // açılışta çözülen oda id'si; slug sonradan değişse de açık panel çalışmaya devam eder
let qr, qrAt = 0;

async function act(body = {}) {
  try {
    const s = await api(`/api/r/${room}/admin`, body, { "x-key": key });
    render(s);
    $("#err").textContent = "";
    return s;
  } catch (e) { $("#err").textContent = e.message; }
}

function render(s) {
  $("#name").textContent = s.name;
  if (Date.now() - qrAt > 20000) {
    const url = `${location.origin}/join?${ref ? `r=${ref}&` : ""}t=${s.token}`;
    qr ? qr.makeCode(url) : (qr = new QRCode($("#qr"), { text: url, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M }));
    qrAt = Date.now();
  }
  const waiting = s.entries.filter((e) => e.status === "waiting");
  const called = s.entries.filter((e) => e.status === "called");
  $("#stats").textContent = `${waiting.length} grup / ${waiting.reduce((n, e) => n + e.size, 0)} kişi bekliyor`;
  $("#avail").innerHTML = s.available
    ? `Ayrılmayı bekleyen boş yer: <b>${s.available}</b> (sıradaki grup sığmıyor) <button class="secondary" data-act="setAvailable" style="width:auto">Sıfırla</button>`
    : "";
  // Yer bilgisi: çağrılanda ayrılan yer, bekleyende (kişi sayısından farklıysa) kabul edilen yerler
  const spots = (e) => e.status === "called" ? ` · <b>${e.alloc ?? e.size} yer</b>`
    : e.accept && (e.accept.length > 1 || e.accept[0] !== e.size) ? ` · ${e.accept.join("/")} yer olur` : "";
  const row = (e, btns) => `<div class="item"><b>#${e.no}</b><span>${e.size} kişi${spots(e)}${e.src === "manual" ? " · elle" : ""}${e.note ? " · " + esc(e.note) : ""}${btns[1]}</span>${btns[0]}</div>`;
  if (s.flex && $("#addAcceptBox").hidden) {
    $("#addAcceptBox").hidden = false;
    renderAccept($("#addAccept"), +$("#addSize").value);
    $("#addSize").onchange = () => renderAccept($("#addAccept"), +$("#addSize").value);
  }
  $("#called").innerHTML = called.map((e) => row(e, [
    `<button class="ok" data-act="arrived" data-id="${e.id}">Geldi</button><button class="bad" data-act="drop" data-id="${e.id}">Gelmedi</button>`,
    ` · <span class="${mins(e.calledAt) >= 10 ? "late" : ""}">${mins(e.calledAt)} dk önce</span>`,
  ])).join("") || '<p class="muted">Yok</p>';
  $("#waiting").innerHTML = waiting.map((e) => row(e, [
    `<button class="secondary" data-act="call" data-id="${e.id}">Çağır</button><button class="secondary" data-act="drop" data-id="${e.id}">Sil</button>`, "",
  ])).join("") || '<p class="muted">Sıra boş</p>';
}

document.body.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (b) act({ action: b.dataset.act, id: b.dataset.id, n: 0 });
});
$("#freeBtn").onclick = () => act({ action: "free", n: +$("#freeN").value });
$("#addBtn").onclick = async () => {
  const s = await act({ action: "add", size: +$("#addSize").value, accept: readAccept($("#addAccept")), note: $("#addNote").value });
  if (s?.added) { alert(`Sıra numarası: ${s.added}\nKişiye söyleyin.`); $("#addNote").value = ""; }
};
$("#resetBtn").onclick = () => confirm("Tüm sıra silinecek. Emin misiniz?") && act({ action: "reset" });
$("#fullBtn").onclick = () => $("#qrCard").classList.toggle("full");

api(`/api/resolve?r=${encodeURIComponent(ref)}`)
  .then((r) => { room = r.room; act(); setInterval(act, 4000); })
  .catch((e) => ($("#err").textContent = `Geçersiz görevli bağlantısı: ${e.message}`));
</script>
</body>
</html>
